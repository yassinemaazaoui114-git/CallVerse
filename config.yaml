# CallVerse prototype configuration.
# Switching model or provider = edit this file only (no code change).

# Fixed "today" for the simulation, so demo runs are reproducible.
sim_today: "2026-10-09"

# T15: ShopNova's real orders come from the Olist dataset (Brazil, prices in reais, BRL). One FIXED rate turns
# them into Tunisian dinars, so the sample is the same on every rebuild (no live lookup). Used only by
# scripts/build_shopnova_sample.py.
currency:
  brl_to_tnd: 0.5625
  rate_date: "2026-10-29"
  rate_source: "Wise mid-market rate, read by the Brain on 2026-10-29"

# OpenAI-compatible API endpoints. key_env = name of the variable in .env that holds the key.
providers:
  groq:       {base_url: "https://api.groq.com/openai/v1", key_env: GROQ_API_KEY}
  openrouter: {base_url: "https://openrouter.ai/api/v1",   key_env: OPENROUTER_API_KEY}
  # tool_call_extras: Gemini needs the extra fields of its tool calls sent back (see llm.messages_for).
  google:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", key_env: GOOGLE_API_KEY,
               tool_call_extras: true}
  # Local Ollama server (task T05). key_env: null = no API key needed (the model runs on this PC).
  ollama:     {base_url: "http://localhost:11434/v1", key_env: null}

# Rate limit (429): wait and retry the same model once if the provider asks for at most this many
# seconds ("retry-after"); a longer wait moves on to the next model (T07).
llm: {max_retry_wait_s: 20}

# Each role lists models tried in order: if one fails on the provider's side (rate limit, model not
# found, server error, unreachable), the next one is used. See callverse/llm.py.
models:
  agents:    # M2, tried in order (backup chain)
    # options = extra request settings. reasoning_effort low (T07): the agents' steps are simple
    # (read, cite, propose), and fewer hidden reasoning tokens keep a turn under Groq's per-minute limit.
    - {provider: groq,       model: "openai/gpt-oss-120b", options: {reasoning_effort: low}}
    # Backup (supervisor decision): smaller model of the same family, free on Groq, with its own rate limits.
    - {provider: groq,       model: "openai/gpt-oss-20b",  options: {reasoning_effort: low}}
    # 3rd backup (T07): other provider, other rate limits. Checked on 2026-10-20 with one Agent B call:
    # gemini-3.5-flash 4.4 s; gemini-3.8-flash 47-76 s and gemini-flash-latest 53 s (too slow, 60 s timeout).
    - {provider: google,     model: "gemini-3.5-flash"}
  # T13: LOCAL test models for the agents (daily tests: no API, no quota, repeatable). Test stand-in only, NOT M2.
  # Used only with env CALLVERSE_AGENTS_SET=local (then every "agents" call, Intake LLM fallback included,
  # uses this list). Force one with CALLVERSE_FORCE_AGENTS_MODEL=<model>; in this local set any Ollama name is
  # accepted (T13c: not listed = same settings as the first entry). Without the env var: not used.
  # The cv-* names are Ollama copies with a context of 8,192 tokens (Modelfile `PARAMETER num_ctx 8192`):
  # Ollama's default context (4,096) can cut a prompt silently. Measured in T13b: the largest single agent
  # prompt is ~2,300 tokens (~6,000 was the total of all calls in one turn), so 8,192 leaves room to spare.
  # T16: this local list is written ONCE; agent_b_local below reuses it with a YAML alias (*agents_local).
  agents_local: &agents_local
    - {provider: ollama,     model: "cv-qwen3.5-4b", temperature: 0, seed: 42, options: {reasoning_effort: none}}
    - {provider: ollama,     model: "cv-phi4-mini",  temperature: 0, seed: 42}
    # M2T: Dali's fine-tuned Qwen3-4B-Instruct-2507 + LoRA (GGUF Q4_K_M), Ollama copy made from
    # models/m2/Modelfile_v3 (num_ctx 8192). No reasoning_effort: it is a non-thinking model. In this TEST list it
    # stays last (used only when forced); in the real lists agent_a and agent_b below it is FIRST (T14d finish).
    - {provider: ollama,     model: "callverse-m2-v3", temperature: 0, seed: 42}
  # T14d finish (WIN RULE true, approved by Yassine 2026-11-01): Agent A's OWN turns have their own list, so the switch
  # to Dali's model does not change the Intake LLM fallback (that one keeps the "agents" lists above).
  # All local: no API, no quota. callverse-m2-v3 first; our cv-qwen3.5-4b is the local backup, then cv-phi4-mini.
  # Measured on the 60 real messages with T14d's code: callverse-m2-v3 56/56, 0 wrong writes (cv-qwen3.5-4b 46/56).
  agent_a:
    - {provider: ollama,     model: "callverse-m2-v3", temperature: 0, seed: 42}
    - {provider: ollama,     model: "cv-qwen3.5-4b", temperature: 0, seed: 42, options: {reasoning_effort: none}}
    - {provider: ollama,     model: "cv-phi4-mini",  temperature: 0, seed: 42}
  # T16 (option A, approved 2026-10-29): a TEMPORARY test setup, the final one is decided after the M2 benchmark.
  # Agent B (refunds) has its own model list, so it can stay on Groq while Intake + Agent A run locally:
  # the local model reads and routes well but almost never calls propose_refund (T13c/T13f).
  # Used by Agent B's turns AND by its "ask Agent A" sub-call (callverse/agents/ask.py). Agent A's own turns
  # and the Intake LLM fallback keep the "agents" list above.
  # Switches: CALLVERSE_AGENTS_SET=local does NOT move B (B stays here, on Groq);
  # CALLVERSE_AGENT_B_SET=local moves B (and its sub-call) to agent_b_local;
  # CALLVERSE_FORCE_AGENT_B_MODEL=<model> keeps one model of B's list. CALLVERSE_FORCE_AGENTS_MODEL no longer
  # affects B.
  # T14d finish (WIN RULE true): Dali's local model first (no API call while it answers); the Groq chain is the backup,
  # then Gemini (other provider, other limits), as in the "agents" chain.
  agent_b:
    - {provider: ollama,     model: "callverse-m2-v3", temperature: 0, seed: 42}
    - {provider: groq,       model: "openai/gpt-oss-120b", options: {reasoning_effort: low}}
    - {provider: groq,       model: "openai/gpt-oss-20b",  options: {reasoning_effort: low}}
    - {provider: google,     model: "gemini-3.5-flash"}
  agent_b_local: *agents_local   # the same entries as agents_local, so the two can never drift
  # P20: Agent C (Urgent & Special Help) has its own list, like B (CALLVERSE_AGENT_C_SET=local -> agent_c_local).
  # T26 (approved by Yassine 2026-11-02): like A and B, Dali's local model first (P20 eval: v3 C 5/7, 0 wrong
  # proposals); the Groq chain is the backup, then Gemini, exactly as B's list.
  agent_c:
    - {provider: ollama,     model: "callverse-m2-v3", temperature: 0, seed: 42}
    - {provider: groq,       model: "openai/gpt-oss-120b", options: {reasoning_effort: low}}
    - {provider: groq,       model: "openai/gpt-oss-20b",  options: {reasoning_effort: low}}
    - {provider: google,     model: "gemini-3.5-flash"}
  agent_c_local: *agents_local
  # P20: Agent D (Availability & Supply) is rules; the model only words the note to the owner (template if it fails).
  # A small local model is enough for one sentence, so D is local by default.
  agent_d: *agents_local
  simulator: # M1, different family (used in task 4)
    # T08 (approved 2026-10-21): gemini-3.5-flash, the Flash model this key accepts that answers fast
    # (gemini-3.8-flash took 47-76 s per call in T07).
    - {provider: google,     model: "gemini-3.5-flash"}
  slm:       # M5, the reply writer (task T05): small local model, no tools, never reads the database.
    # T13e (approved 2026-10-28): qwen2.5:1.5b passed 14/14 practice replies on the first try, like qwen2.5:3b
    # (0 template, 0 invented content). It uses ~1 GB less GPU memory (1.2 GB vs 2.2 GB loaded) and has the
    # Apache 2.0 licence (qwen2.5:3b: Qwen research licence, non-commercial). It is also the base for the later LoRA.
    # qwen2.5:3b stays only as the backup: used only if 1.5b is missing or unreachable.
    # temperature 0 + seed: the same decision always gives the same reply (reproducible evaluation).
    - {provider: ollama,     model: "qwen2.5:1.5b", temperature: 0, seed: 42}
    - {provider: ollama,     model: "qwen2.5:3b",   temperature: 0, seed: 42}

# Layer 3 stub (ShopNova finance). Refunds above 300 TND go to finance: that threshold is in rule
# R-ESC-01's condition (callverse/kb/policies_shopnova.json). The stub approves up to this amount
# and refuses above it.
# T18: mode stub = the rule above decides (default: tests, practice set, demo backup). mode queue = a REAL approval
# queue: the refund waits for the ShopNova admin (Refund approvals page). Turned on with the env var
# CALLVERSE_LAYER3_MODE=queue (set by start_shopnova.ps1 and the ShopNova app), so this file stays on stub.
layer3: {mode: stub, stub_max_approve_tnd: 500}

# Intake (task T03): a fixed pipeline, not an agent. Local models run on CPU.
intake:
  # M3 (T23 benchmark, docs/benchmarks/M3.md): bge-small stays, with the T23 val-tuned settings below.
  # bge-base scored higher but its Intake p95 on the demo PC was 124-134 ms (> 100 ms limit), so T24 did not choose it.
  embedding_model: "BAAI/bge-small-en-v1.5"                            # M3
  embedding_revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"       # Hugging Face commit tested in T23
  emotion_model: "j-hartmann/emotion-english-distilroberta-base"       # M4
  sentiment_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"  # M4
  # Each sentence keeps its best reason if that score (mean of its top_k cosine similarities to the
  # reason's examples) is >= reason_threshold. top_k and both thresholds come from the T23 benchmark:
  # tuned on the validation sets (ShopNova 0.69, Atlas 0.54 below).
  top_k: 5
  reason_threshold: 0.69
  # main_reason = the first reason of this list found in the ticket (T04, approved).
  # Money and damage come first: they need Agent B even when the client also asks "where is it?".
  main_reason_order: &shopnova_reason_order [damaged_item, cancel_order, refund_request, return_item, late_delivery, order_status, other]

  priority:
    # severity (0-1) = base for the reason + bonuses, capped at 1
    severity_base:
      order_status: 0.2
      late_delivery: 0.5
      refund_request: 0.5
      cancel_order: 0.5
      return_item: 0.3
      damaged_item: 0.6
      other: 0.2
    late_bonus:   {days_late_over: 5,  add: 0.3}
    # "paid over" threshold = the 300 TND of rule R-ESC-01 (read by priority.py, written in one place only)
    amount_bonus: {add: 0.2}
    # time_pressure (0-1) = min(days_late / time_pressure_days, 1); 0 when the order is delivered
    time_pressure_days: 7
    # priority = weighted sum of the three parts
    weights: {severity: 0.6, time_pressure: 0.25, emotion_intensity: 0.15}
    # label: high if priority >= high, medium if >= medium, else low
    labels: {high: 0.6, medium: 0.35}

# Queues (task T04): rules, not an LLM, so every routing decision is predictable and explainable.
# main_reason -> agent. Layer L1 = the first-line agents A and B.
queues:
  layer: L1
  # P20: a ticket whose main reason passed Intake's reason_threshold by less than this goes to Agent C (Layer 2,
  # "low confidence"). 0.02 = 2 points of cosine score. NOT tuned on any test set: a first value, to review.
  # T26: OFF (null). With 0.02, the 72-message check (T14f set) sent h10 (margin 0.018, a cancel that must be declined)
  # and s02 (margin -0.007, a damaged item that needs a photo) to C instead of B: 2 wrong outcomes that main had right.
  # Negative margins (reason under the threshold) were caught too. Set a number again to turn it on.
  low_confidence_margin: null
  routes: &shopnova_routes
    order_status: A
    late_delivery: A
    refund_request: B
    cancel_order: B
    return_item: B
    damaged_item: B
    other: A
  # Sentence that announces a handover to Agent B, per reason (T06, Brain decision).
  # Agent A hands over only for money requests, so its handovers use refund_request.
  handover_texts: &shopnova_handover_texts
    refund_request: "Your request is passed on for a refund check."
    return_item: "Your request is passed on for a returns check."
    damaged_item: "Your request is passed on for a damage check."
    cancel_order: "Your request is passed on for a cancellation check."
    # P20: Agent A hands an urgent need / special help over to Agent C.
    urgent_help: "Your request is passed on to our special help team."

# Coordinator (task T07): rules only, no LLM. It checks every agent proposal before anything is written.
coordinator:
  # Which rules can justify each action. Rules such as R-REF-05 (limit) or R-ESC-01 (finance) are
  # always checked, but they cannot be the reason FOR a refund.
  allowed_rules: &shopnova_allowed_rules
    refund: [R-REF-03, R-RET-01, R-DMG-01]
    subscribe: [R-NOT-01, R-DEL-02]
    cancel: [R-CAN-01]
  # A case may be sent back to the agent this many times; the next send-back becomes "escalate".
  max_send_backs: 2

# Pipeline switches (T13c).
pipeline:
  # Safety net: when the agent's text claims a proposal but it called no proposal tool, run it once more.
  # OFF by default (Brain review 2026-10-28): in T13c it fired mostly on "no proposal needed" sentences and
  # never helped. Turn on with true to test it again.
  proposal_claim_retry: false
  # P20 Layer 2 (spec: "C = Layer 2 escalation"): when Agent A or B ends in "escalate" (e.g. sent back twice, a dispute),
  # Agent C gets the case once: it may offer a replacement / hold, or pass it to a human colleague (Layer 3). ON.
  layer2_agent_c: true
  # P20: Agent C named an offer in its text but called no proposal tool -> one more run with a note (C only).
  # ON: base Qwen did this in 5 of 7 C practice cases (tasks/P20_report.md). The net itself writes nothing.
  c_offer_retry: true

# SLM reply writer (tasks T05, T05b): rule-check settings and the calm openers added by code.
slm:
  # Forbidden promises / wordings: [regex (lower case text), keyword]. A match is allowed only when the
  # keyword appears in the decision itself (facts, next_step, must_say): then the Coordinator approved it.
  # Found on the dev set and the spent v1 set, never on the held-out v2 set.
  forbidden:
    - ['keep you (?:updated|informed|posted)', 'keep you']
    - ['\b(?:we are|we''re|we will be|we''ll be|actively)\s+monitoring\b|\bmonitor(?:ing)? (?:it|your|the)\b', 'monitor']
    - ['\bguarantee', 'guarantee']
    - ['\bwithin (?:\d+|a|an|one|two|three|four|five|six|seven|the next|a few|few)\s*(?:\w+\s)?(?:hours?|days?|business days|working days|minutes?|weeks?)\b', 'within']
    - ['\b(?:we will|we''ll|i will|i''ll) (?:contact|call|chase|reach out to) the carrier', 'carrier']
    - ['\b(?:we will|we''ll|i will|i''ll) (?:notify|alert|inform) you\b|\byou will (?:be notified|receive a notification)', 'notif']
    - ['\b(?:as soon as possible|asap|right away|immediately|shortly|soon|right back|in no time)\b', 'soon']
    - ['\bkeep an eye\b|\b(?:any|further|future|more) updates?\b|\bbe in touch\b', 'update']
    - ['\b(?:compensation|voucher|discount|coupon|gift card)\b', 'compensation']
    # T05b additions (seen in v1 / dev replies)
    - ['\bcontact\b[^.!?]{0,40}\bdirectly\b', 'directly']
    - ['\bas (?:quickly|fast) as (?:possible|we can)\b', 'quickly']
    - ['\bminimum threshold\b|\b(?:did|does) not (?:meet|reach) the\b|\bbelow the threshold\b', 'minimum']
    - ['\bcommitted to (?:resolving|fixing|solving)\b', 'committed']
    - ['\btechnical (?:issue|problem|error)\b', 'technical']
    # T13f: instruction labels copied from the SLM prompt into the reply (T13e: "length: Very short: 2 or 3
    # sentences, at most 45 words", "The next step is: ..."). The keyword 'instruction-label' never appears in a
    # decision, so these are always rejected.
    - ['\b(?:tone|length|style|formality|emotion|outcome|decision|facts)\s*:', 'instruction-label']
    - ['\bnext step is\s*:|\b(?:next_step|must_say|order_number|booking_number)\b', 'instruction-label']
    - ['\bat most \d+ words\b|\b\d+ (?:or|to) \d+ sentences\b', 'instruction-label']
  # Warm-up (T09): one tiny call at start-up loads the model into memory, with a longer timeout, so the
  # first real reply is not slowed by the model load (T08: 62 s timeout on the first reply).
  warmup_timeout_s: 120
  # Fixed first sentence when the client is upset (shouting or negative sentiment), chosen by formality.
  calm_openers:
    formal: "Please accept our apologies for the trouble."
    casual: "I'm really sorry for the trouble."
    neutral: "I'm sorry for the trouble."
  # RL1 / RL1b: reply style (callverse/slm/reply_styles.py): short | warm | warm_next_step. null = the writer as it was
  # (calm opener only for an upset client). The env var CALLVERSE_REPLY_STYLE and decision["reply_style"] override this;
  # the RL policy (RL5) will set it per reply later. It changes wording only, never a decision.
  reply_style: null

# Local platform server (P05, P09). The demo screen (/demo: type a message, run the stories, see every step)
# runs the real pipeline and can reset the demo data, so it is OFF by default: turn it on only for a live demo.
server:
  demo_enabled: false

# CallVerse Console (T19, apps/console, port 8502, read only). The companies listed here are always shown in its
# filters, even before their first ticket; companies found in callverse.db are added.
# late_reply_s: a reply slower than this counts as "late" on the Dashboard. groq_daily_tokens: the free daily quota
# shown as "Groq tokens used today" (the Console only shows it; it never stops anything).
console:
  companies: [shopnova, atlas]
  late_reply_s: 30
  groq_daily_tokens: 200000

# T21: the companies of the center. One entry per company: callverse/companies.py reads it, and the shared code
# (Intake, router, rule search, reply writer) asks it instead of assuming ShopNova. The company comes from the
# channel (web_chat.send), never from the message text. A ticket without a company is a ShopNova ticket.
# shopnova = today's values: the aliases (*name) point at the blocks above, so they are written in one place only.
# The allow-lists are not here: they stay in code, in callverse/tools/registry.py (a locked decision).
companies:
  shopnova:
    name: "ShopNova"
    description: "an online shop in Tunisia"
    data_module: callverse.data.db
    coordinator: callverse.coordinator.coordinator
    rules_file: callverse/kb/policies_shopnova.json
    profile_file: callverse/data/company_profile.json
    policy_cache: callverse/kb/policy_vectors.npz
    reasons: [order_status, late_delivery, refund_request, cancel_order, return_item, damaged_item, other]
    reason_examples: callverse/intake/data/reason_examples.json
    reason_cache: callverse/intake/data/reason_vectors.npz
    reason_threshold: 0.69   # T23 benchmark, val-tuned (bge-small, top_k 5)
    main_reason_order: *shopnova_reason_order
    routes: *shopnova_routes
    handover_texts: *shopnova_handover_texts
    finance_rule: R-ESC-01
    allowed_rules: *shopnova_allowed_rules
  atlas:
    name: "Atlas Travel"
    description: "a travel agency in Tunis that sells hotel stays and flights"
    data_module: callverse.data.atlas.db
    coordinator: callverse.coordinator.atlas_coordinator
    rules_file: callverse/kb/policies_atlas.json
    profile_file: callverse/data/atlas_profile.json
    policy_cache: callverse/kb/policy_vectors_atlas.npz
    reasons: [booking_status, delay_disruption, cancellation, refund_request, compensation_request, rebooking,
              special_assistance, other]
    reason_examples: callverse/intake/data/reason_examples_atlas.json
    reason_cache: callverse/intake/data/reason_vectors_atlas.npz
    # T23 benchmark, val-tuned (bge-small, top_k 5); the leave-one-out on the examples is only reported (T24).
    reason_threshold: 0.54
    # Things only a human can do today come first: they must reach a colleague, not an agent.
    main_reason_order: [special_assistance, rebooking, compensation_request, refund_request, cancellation,
                        delay_disruption, booking_status, other]
    priority:
      severity_base:
        special_assistance: 0.7
        rebooking: 0.6
        delay_disruption: 0.5
        refund_request: 0.5
        cancellation: 0.4
        compensation_request: 0.4
        booking_status: 0.2
        other: 0.2
      # [hours before departure / arrival, time pressure]: the first line that fits wins, else 0 (past trips: 0).
      time_pressure_hours: [[24, 1.0], [72, 0.5]]
    # escalate = no agent: the ticket goes to a human colleague. P20: rebooking and special assistance go to Agent C.
    routes:
      booking_status: A
      delay_disruption: A
      other: A
      refund_request: B
      compensation_request: B
      cancellation: B
      rebooking: C
      special_assistance: C
    handover_texts:
      refund_request: "Your request is passed on for a refund check."
      compensation_request: "Your request is passed on for a compensation check."
      cancellation: "Your request is passed on for a cancellation check."
      urgent_help: "Your request is passed on to our special help team."
    finance_rule: AT-ESC-01
    # Finance stub (tests only, layer3 mode "stub"): a refund above AT-ESC-01's limit is approved up to this amount
    # and refused above it. Its own value: ShopNova's 500 is below Atlas's 1,500 limit, so nothing could be approved.
    stub_max_approve_tnd: 2000
    # Which rules can justify each action. AT-REF-01, AT-ESC-01 and AT-FLT-06 are always checked, never a reason FOR one.
    allowed_rules:
      refund: [AT-FLT-01, AT-FLT-04, AT-HOT-02, AT-HOT-04]
      compensation: [AT-FLT-02, AT-FLT-03]
      cancel_hotel: [AT-HOT-01, AT-HOT-02, AT-HOT-03]
