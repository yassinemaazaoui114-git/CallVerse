# CallVerse prototype configuration.
# Switching model or provider = edit this file only (no code change).

# Fixed "today" for the simulation, so demo runs are reproducible.
sim_today: "2026-10-09"

# OpenAI-compatible API endpoints. key_env = name of the variable in .env that holds the key.
providers:
  groq:       {base_url: "https://api.groq.com/openai/v1", key_env: GROQ_API_KEY}
  openrouter: {base_url: "https://openrouter.ai/api/v1",   key_env: OPENROUTER_API_KEY}
  google:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", key_env: GOOGLE_API_KEY}

# Each role lists models tried in order: if one fails on the provider's side (rate limit, model not
# found, server error, unreachable), the next one is used. See callverse/llm.py.
models:
  agents:    # M2, tried in order (backup chain)
    - {provider: groq,       model: "openai/gpt-oss-120b"}
    # Backup (supervisor decision): smaller model of the same family, free on Groq, with its own rate limits.
    - {provider: groq,       model: "openai/gpt-oss-20b"}
  simulator: # M1, different family (used in task 4)
    # Supervisor decision: the Gemini Flash model this account can access. To verify at task 4.
    - {provider: google,     model: "gemini-3.8-flash"}

# Voice + text web channel (callverse/web). It is a CHANNEL ADAPTER: it turns audio into text and the
# approved reply into audio. It never decides anything itself; business logic stays in the agents.
voice:
  # auto = "real" when the agents' API key (GROQ_API_KEY) is set, otherwise "mock".
  # real = Agent A answers (the only agent built so far). mock = fixed demo replies, no agent, no data.
  mode: auto
  languages: [en, fr]
  stt:
    # Speech-to-text providers, tried in order. groq = Whisper on Groq's API (needs GROQ_API_KEY);
    # faster_whisper = the open-source Whisper model running inside our own server container (CPU).
    providers: [groq, faster_whisper]
    groq: {provider: groq, model: "whisper-large-v3-turbo"}
    # "base": in our round-trip test (Piper voice -> Whisper) it was as accurate as "small" and 3x faster.
    faster_whisper: {model: "base", compute_type: "int8", cpu_threads: 2}
  tts:
    # Piper voices (open source, run on the server CPU). Chosen by a round-trip test and by their data licence:
    # cori = LibriVox (public domain) recordings, upmc = CC BY-SA 4.0.
    voices: {en: "en_GB-cori-medium", fr: "fr_FR-upmc-medium"}
  limits:
    max_audio_bytes: 5000000      # 5 MB
    max_audio_seconds: 30
    max_text_chars: 1000
    turns_per_session_per_10min: 30
    turns_per_ip_per_hour: 120
    turns_global_per_hour: 600    # whole site, protects the shared API quota
    sessions_per_ip_per_hour: 30
    session_ttl_minutes: 60
    max_history_turns: 10         # user+assistant pairs kept as conversation context
