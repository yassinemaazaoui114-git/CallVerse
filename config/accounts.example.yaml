    amira:      {name: Amira Gharbi,         email: amira@example.com,   roles: [user],       user_id: 3}
    karim:      {name: Karim Jaziri,         email: karim@example.com,   roles: [user],       user_id: 4}
    leila:      {name: Leila Mansour,        email: leila@example.com,   roles: [user],       user_id: 5}
    admin:      {name: ShopNova Admin,       email: null,                roles: [admin],      user_id: null}
    supervisor: {name: CallVerse Supervisor, email: null,                roles: [supervisor], user_id: null}
